name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger from the Actions tab: releases the version currently in
  # src/manifest.json and creates the v<version> tag automatically.
  workflow_dispatch:

# Default for every job: read-only. Each job below asks for what it needs.
permissions:
  contents: read

# Two jobs, so that no third-party code ever runs next to the store keys
# without a human approving it:
#
#   release  builds and tests the zip and creates the GitHub Release.
#            No store credentials. Runs only GitHub's own actions.
#   publish  submits that exact zip to the stores. Runs in the
#            "store-release" environment, which holds the store credentials
#            and requires a reviewer to approve each run
#            (Settings → Environments). The publisher tool is installed from
#            a committed lockfile with install scripts disabled.
#
# Actions are pinned to full commit SHAs (tags can be moved). Dependabot
# proposes updates — see .github/dependabot.yml.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub Release
    outputs:
      version: ${{ steps.meta.outputs.version }}
      zip_name: ${{ steps.meta.outputs.zip_name }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Determine release version
        id: meta
        run: |
          set -euo pipefail
          MANIFEST_VERSION=$(jq -r .version src/manifest.json)
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$MANIFEST_VERSION" ]; then
              echo "::error::Tag v${TAG} does not match src/manifest.json version ${MANIFEST_VERSION}"
              exit 1
            fi
          elif gh release view "v${MANIFEST_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release v${MANIFEST_VERSION} already exists - bump src/manifest.json first"
            exit 1
          fi
          echo "version=${MANIFEST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=phone-free-2fa-v${MANIFEST_VERSION}.zip" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # A release is never built from code that fails its tests.
      - name: Run tests
        run: npm test

      # Reproducible: the same commit always gives the same bytes, so anyone
      # can rebuild a tag and compare the SHA-256 (see tools/build-zip.sh).
      - name: Build extension zip
        id: build
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
        run: |
          set -euo pipefail
          tools/build-zip.sh "$ZIP_NAME"
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"
          echo "sha256=$(cut -d' ' -f1 "$ZIP_NAME.sha256")" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          tools/changelog-section.sh "$VERSION" > changelog-section.md

          if [ ! -s changelog-section.md ]; then
            echo "No changelog section found for version ${VERSION}." > changelog-section.md
          fi

          {
            cat changelog-section.md
            echo ""
            echo "---"
            echo ""
            echo "### Install"
            echo "Download \`phone-free-2fa-v${VERSION}.zip\` below for Chrome Web Store, Firefox Add-ons, or sideloading."
            echo ""
            echo "### Verify"
            echo "SHA-256 of the zip: \`${SHA256}\`"
            echo ""
            echo "This is the exact file submitted to the stores. To rebuild it yourself: check out tag \`v${VERSION}\` and run \`tools/build-zip.sh\`."
            echo ""
            echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md"
          } > release-notes.md

      # GitHub's own CLI (preinstalled on the runner) instead of a third-party action.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" "$ZIP_NAME" "$ZIP_NAME.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION} — Phone-Free 2FA" \
            --notes-file release-notes.md

  # Submits the released zip to the Chrome Web Store and Firefox Add-ons for
  # review. Waits for a reviewer's approval (environment protection rule).
  # Skips any store whose credentials are not configured.
  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: store-release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      ZIP_NAME: ${{ needs.release.outputs.zip_name }}
      EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Publish the exact file on the GitHub Release — not a rebuild.
      - name: Download and verify the released zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern "$ZIP_NAME"
          echo "${EXPECTED_SHA256}  ${ZIP_NAME}" | sha256sum --check --strict

      # Exact versions from the committed lockfile, integrity-checked, and no
      # package may run code at install time. No store secrets in this step.
      - name: Install the store publisher
        working-directory: tools/publish
        run: npm ci --ignore-scripts

      - name: Submit to stores
        env:
          # Chrome Web Store API v2 authenticates with a Google Cloud service
          # account (the v1.1 OAuth client + refresh token flow shuts down
          # October 15th, 2026).
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${CHROME_SERVICE_ACCOUNT_PRIVATE_KEY}" ]; then
            ARGS+=(--chrome-zip "$ZIP_NAME")
          else
            echo "Chrome credentials not configured - skipping Chrome Web Store."
          fi
          if [ -n "${FIREFOX_JWT_SECRET}" ]; then
            ARGS+=(--firefox-zip "$ZIP_NAME")
          else
            echo "Firefox credentials not configured - skipping Firefox Add-ons."
          fi
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "No store credentials configured - skipping submission entirely."
            exit 0
          fi
          tools/publish/node_modules/.bin/publish-extension "${ARGS[@]}"

      # Copies this version's CHANGELOG.md section onto the AMO version as
      # release notes (publish-browser-extension can't set them). Chrome has
      # no equivalent field. Non-fatal: a failure here shouldn't undo an
      # otherwise successful release.
      - name: Update Firefox release notes
        continue-on-error: true
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${FIREFOX_JWT_SECRET}" ]; then
            echo "Firefox credentials not configured - skipping release notes."
            exit 0
          fi
          tools/changelog-section.sh "$VERSION" > changelog-section.md
          node <<'EOF'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const notes = fs.readFileSync('changelog-section.md', 'utf8').trim();
          if (!notes) {
            console.log('Changelog section is empty - nothing to publish.');
            process.exit(0);
          }

          const b64 = (s) => Buffer.from(s).toString('base64url');
          const iat = Math.floor(Date.now() / 1000);
          const payload = { iss: process.env.FIREFOX_JWT_ISSUER, jti: crypto.randomUUID(), iat, exp: iat + 300 };
          const unsigned = `${b64(JSON.stringify({ alg: 'HS256', typ: 'JWT' }))}.${b64(JSON.stringify(payload))}`;
          const signature = crypto.createHmac('sha256', process.env.FIREFOX_JWT_SECRET).update(unsigned).digest('base64url');
          const headers = { Authorization: `JWT ${unsigned}.${signature}`, 'Content-Type': 'application/json' };
          const base = `https://addons.mozilla.org/api/v5/addons/addon/${encodeURIComponent(process.env.FIREFOX_EXTENSION_ID)}`;

          const main = async () => {
            const list = await fetch(`${base}/versions/?filter=all_with_unlisted`, { headers });
            if (!list.ok) throw new Error(`Listing versions failed: ${list.status} ${await list.text()}`);
            const { results } = await list.json();
            const version = results.find((v) => v.version === process.env.VERSION);
            if (!version) throw new Error(`Version ${process.env.VERSION} not found on AMO`);

            const patch = await fetch(`${base}/versions/${version.id}/`, {
              method: 'PATCH',
              headers,
              body: JSON.stringify({ release_notes: { 'en-US': notes } }),
            });
            if (!patch.ok) throw new Error(`Updating release notes failed: ${patch.status} ${await patch.text()}`);
            console.log(`Release notes set for Firefox version ${process.env.VERSION}.`);
          };

          main().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
