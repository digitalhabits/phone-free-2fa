<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone-Free 2FA — Touch ID</title>
    <style>
        /* Schibsted Grotesk (OFL; licence in fonts/OFL.txt), as in popup.css */
        @font-face {
            font-family: "Schibsted Grotesk";
            font-style: normal;
            font-weight: 400 900;
            font-display: swap;
            src: url("fonts/SchibstedGrotesk-Variable-latin.woff2") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: "Schibsted Grotesk";
            font-style: normal;
            font-weight: 400 900;
            font-display: swap;
            src: url("fonts/SchibstedGrotesk-Variable-latin-ext.woff2") format("woff2");
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }

        /* Light: the Centre for Digital Habits colours, as in the popup.
           Dark keeps its own colours. */
        :root {
            --bg: #f5f1ea;
            --fg: #1b3d4a;
            --muted: #586f77;
            --error: #b4432e;
            --primary: #005d53;
            --border: #d2d4d0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --fg: #e5e7eb;
                --muted: #9ca3af;
                --error: #f97066;
                --border: #404040;
                --primary: #15a883;
            }
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }

        main {
            max-width: 460px;
            margin: 80px auto 40px;
            padding: 0 20px;
            text-align: center;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 22px;
            margin: 0 0 12px;
        }

        p {
            line-height: 1.55;
            margin: 8px 0;
            color: var(--muted);
        }

        .error {
            color: var(--error);
            display: none;
        }

        .actions {
            margin-top: 28px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: transparent;
            border-color: var(--border);
            color: inherit;
        }

        button[disabled] {
            opacity: 0.55;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <main>
        <h1 id="title">Setting up Touch ID</h1>
        <p id="status">Look for the Touch ID prompt from your browser.</p>
        <p class="error" id="error"></p>
        <div class="actions">
            <button class="btn-secondary" id="cancel-btn">Cancel</button>
            <button class="btn-primary" id="retry-btn" style="display: none;">Try again</button>
        </div>
    </main>
    <script type="module" src="biometric-tab.js"></script>
</body>

</html>
